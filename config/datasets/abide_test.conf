# ABIDE I/II test subset in DPABI layout: <site>/FunImg/<sub>/rest.nii.gz, <site>/T1Img/<sub>/*.nii.gz
# Paths are container paths (see docker/run_docker.ps1). Environment variables override these values.

: "${INPUT_DIR:=/data}"
: "${OUT_DIR:=/out}"
: "${INPUT_LAYOUT:=dpabi}"
: "${ACQ_TABLE:=$REPO_DIR/config/datasets/abide_acquisition.tsv}"
: "${TASK_NAME:=rest}"

: "${ANAT_MODE:=freesurfer}"
: "${SURFACE:=yes}"
: "${MNI_RES:=2}"

: "${NTHREADS:=8}"
: "${N_JOBS:=1}"

: "${DENOISE_STRATEGIES:=wmcsf24 wmcsf24gsr acompcor}"
: "${ATLASES:=Schaefer2018_100Parcels_7Networks Schaefer2018_200Parcels_7Networks}"
# Yeo100 (parcellations/ThomasYeo_100.nii) is Schaefer2018_100Parcels_7Networks stored LAS: identical
# labels in world space, so its tables equal the Schaefer-100 ones (kept for continuity with v1 only).
: "${CUSTOM_ATLASES:=Yeo100=$REPO_DIR/parcellations/ThomasYeo_100.nii}"
