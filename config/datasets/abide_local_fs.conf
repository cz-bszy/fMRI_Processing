# Overnight local FreeSurfer variant of the smoke test: the same two subjects
# (config/datasets/abide_smoke_subjects.txt) with recon-all, bbregister coregistration
# and the fsLR-32k surface branch. recon-all takes 6-12 h per subject on 4 threads;
# FS_DIR must be a Docker named volume (docker/run_docker.ps1 does this).
# Environment variables override every value.

: "${INPUT_DIR:=/data}"
: "${OUT_DIR:=/out}"
: "${INPUT_LAYOUT:=dpabi}"
: "${ACQ_TABLE:=$REPO_DIR/config/datasets/abide_acquisition.tsv}"
: "${TASK_NAME:=rest}"
: "${SUBJECT_LIST:=$REPO_DIR/config/datasets/abide_smoke_subjects.txt}"

# anatomy: recon-all, surfaces, precise SyN (default) to the 1 mm template
: "${ANAT_MODE:=freesurfer}"
: "${SURFACE:=yes}"
: "${MNI_RES:=2}"

# execution: one subject at a time, 4 threads (recon-all -openmp 4)
: "${N_JOBS:=1}"
: "${NTHREADS:=4}"
: "${MIN_MEM_GB:=6}"

# denoising / time series: same as the smoke test, so volume and surface streams are comparable
: "${DENOISE_STRATEGIES:=wmcsf24 wmcsf24gsr}"
: "${ATLASES:=Schaefer2018_100Parcels_7Networks}"
# Yeo100 (parcellations/ThomasYeo_100.nii) is Schaefer2018_100Parcels_7Networks stored LAS: identical
# labels in world space, so its tables equal the Schaefer-100 ones (kept for continuity with v1 only).
: "${CUSTOM_ATLASES:=Yeo100=$REPO_DIR/parcellations/ThomasYeo_100.nii}"
: "${SMOOTH_FWHM:=0}"
# ASD vs TDC in the group report: the test set ships a per-subject table with a diagnosis
# column (SUB_ID without 'sub-', group = ASD/TDC). Used only when the file is present.
if [[ -z "${PHENOTYPE_TSV:-}" && -f "$INPUT_DIR/dpabi_parameters_by_subject.csv" ]]; then
    PHENOTYPE_TSV="$INPUT_DIR/dpabi_parameters_by_subject.csv"
    : "${PHENOTYPE_ID_COLUMN:=SUB_ID}"
fi
