# Reduced local smoke test of the ABIDE subset (DPABI layout, see abide_test.conf):
# two subjects (config/datasets/abide_smoke_subjects.txt), no FreeSurfer, no surface
# branch, quick ANTs SyN, one 100-parcel atlas, no smoothed copy. Sized for a Docker
# Desktop VM with 8-12 GB RAM and 4 threads. Environment variables override every value.
#
# sub-0028744 (ABIDEII-GU_1): STC applied from the acquisition table (tier A evidence).
# sub-0029150 (ABIDEII-NYU_2): slice order unresolved -> STC skipped; short z-FOV (102 mm).

: "${INPUT_DIR:=/data}"
: "${OUT_DIR:=/out}"
: "${INPUT_LAYOUT:=dpabi}"
: "${ACQ_TABLE:=$REPO_DIR/config/datasets/abide_acquisition.tsv}"
: "${TASK_NAME:=rest}"
: "${SUBJECT_LIST:=$REPO_DIR/config/datasets/abide_smoke_subjects.txt}"

# anatomy: SynthStrip + SynthSeg instead of recon-all; quick SyN to the 1 mm template
: "${ANAT_MODE:=synth}"
: "${NORM_QUALITY:=quick}"
: "${SURFACE:=no}"
: "${MNI_RES:=2}"

# execution: one subject at a time, 4 threads, small-VM memory guard
: "${N_JOBS:=1}"
: "${NTHREADS:=4}"
: "${MIN_MEM_GB:=6}"

# denoising / time series: the two default strategies, Schaefer-100 plus the legacy Yeo-100 volume
: "${DENOISE_STRATEGIES:=wmcsf24 wmcsf24gsr}"
: "${ATLASES:=Schaefer2018_100Parcels_7Networks}"
# Yeo100 (parcellations/ThomasYeo_100.nii) is Schaefer2018_100Parcels_7Networks stored LAS: identical
# labels in world space, so its tables equal the Schaefer-100 ones (kept for continuity with v1 only).
: "${CUSTOM_ATLASES:=Yeo100=$REPO_DIR/parcellations/ThomasYeo_100.nii}"
: "${SMOOTH_FWHM:=0}"
