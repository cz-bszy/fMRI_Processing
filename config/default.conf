# =============================================================================
# fMRI_Processing v2 - default configuration
#
# Plain bash KEY=VALUE. Load order: this file -> dataset conf (-c) -> environment.
# A variable already set in the environment always wins, so a single value can be
# overridden for one run:   NTHREADS=8 ./run_pipeline.sh -c my.conf
# Every assignment therefore uses the  : "${KEY:=value}"  form.
# =============================================================================

# ----------------------------- paths ----------------------------------------
: "${INPUT_DIR:=}"                 # raw dataset root (required)
: "${OUT_DIR:=}"                   # everything the pipeline writes (required)
: "${FS_DIR:=}"                    # FreeSurfer SUBJECTS_DIR; default $OUT_DIR/freesurfer
: "${RESOURCE_DIR:=}"              # templates/atlases cache; default $OUT_DIR/resources
: "${PYTHON_BIN:=/opt/micromamba/envs/neuro/bin/python}"

# ----------------------------- input ----------------------------------------
: "${INPUT_LAYOUT:=bids}"          # bids | dpabi
: "${ACQ_TABLE:=}"                 # per-site acquisition TSV (see docs/DESIGN.md section 5)
: "${TASK_NAME:=rest}"             # task label given to DPABI-layout runs
: "${BIDS_FUNC_GLOB:=*task-rest*_bold.nii*}"   # bids layout: which runs to process
: "${BIDS_T1_GLOB:=*_T1w.nii*}"
: "${DPABI_FUNC_DIR:=FunImg}"      # dpabi layout: <site>/FunImg/<sub>/*.nii.gz (site level optional)
: "${DPABI_T1_DIR:=T1Img}"
: "${SUBJECT_LIST:=}"              # optional file, one subject id per line; empty = all

# ----------------------------- execution ------------------------------------
: "${NTHREADS:=4}"                 # threads per subject
: "${N_JOBS:=1}"                   # subjects processed in parallel
: "${MIN_MEM_GB:=8}"               # refuse heavy stages below this much RAM (0 = no check)
: "${CPU_BUDGET:=}"               # optional CPU cap; also respects affinity/cgroup/Slurm limits
: "${MEMORY_BUDGET_GB:=}"          # optional memory cap in GiB; cannot raise detected limits
: "${SKIP_EXISTING:=yes}"          # skip stages whose parameter hash is unchanged
: "${FORCE:=no}"                   # yes = rerun the selected stages regardless
: "${DRY_RUN:=no}"
: "${KEEP_WORK:=no}"               # no = delete per-volume temporaries after resampling
: "${FREEZE_CODE:=yes}"            # run a copy of the code (logs/code_<run>): editing the repository
                                   # during a run cannot corrupt it; the copy documents the results
: "${STAGES:=ingest anat_recon anat_prep func_prep confounds denoise surface timeseries validate qc}"

# ----------------------------- anatomy --------------------------------------
: "${ANAT_MODE:=freesurfer}"       # freesurfer (recon-all; needed for SURFACE) | synth (SynthStrip+SynthSeg, fast)
: "${RECON_FLAGS:=}"               # extra recon-all flags, e.g. "-3T" or "-cw256"
: "${SYNTHSEG_FLAGS:=--robust}"    # ANAT_MODE=synth: extra mri_synthseg flags; "" = plain SynthSeg 2.0
                                   # (less memory; the T1 is always cropped to the brain box first)
: "${WM_ERODE:=2}"                 # erosion iterations on the 1 mm grid
: "${CSF_ERODE:=1}"
: "${MIN_TISSUE_VOX:=20}"          # on the BOLD grid; below this the erosion is relaxed and flagged
: "${TEMPLATE_NAME:=MNI152NLin6Asym}"   # = FSL MNI152; files taken from $FSLDIR/data/standard
: "${NORM_QUALITY:=precise}"       # precise = antsRegistrationSyN.sh | quick = antsRegistrationSyNQuick.sh
: "${ANTS_SEED:=1}"                # fixed seed for reproducible registration

# ----------------------------- functional -----------------------------------
: "${DROP_VOLUMES:=4}"             # default; a DropVolumes value in the sidecar/acquisition table wins
: "${DESPIKE:=yes}"                # 3dDespike before motion estimation
: "${STC:=auto}"                   # auto = use eligible sidecar/table timing | require | off
: "${STC_INTERP:=quintic}"         # 3dTshift interpolation: quintic | heptic | Fourier | cubic
: "${EPI_MASK_METHOD:=synthstrip}" # synthstrip | automask
: "${BBR_MAX_DISP_MM:=15}"         # reject BBR if it moves the init by more than this (lta_diff --dist 4)
: "${BBR_MAX_COST:=0.9}"           # reject BBR above this final cost
: "${FUNC_T1W_RES:=3}"             # isotropic voxel size (mm) of the T1w-space BOLD grid
: "${MNI_RES:=2}"                  # template-space output grid: 2 or 3 (SURFACE=yes needs 2)
: "${SCALE_TARGET:=10000}"         # in-brain median of the mean image after global scaling

# ----------------------------- confounds ------------------------------------
: "${ACOMPCOR_N:=5}"               # components kept per tissue
: "${HIGHPASS_SEC:=128}"           # DCT high-pass applied before aCompCor PCA
: "${CENSOR_FD:=0.5}"              # mm (Power FD); 0 = no censoring
: "${CENSOR_PREV:=no}"             # also censor the frame before a high-FD frame
: "${CENSOR_DVARS:=0}"             # standardised DVARS threshold; 0 = off

# ----------------------------- denoising ------------------------------------
: "${DENOISE_STRATEGIES:=wmcsf24 wmcsf24gsr}"   # see docs/DESIGN.md section 7 (05 denoise)
: "${FILTER_MODE:=bandpass}"       # bandpass | highpass | none
: "${BAND_LOW_HZ:=0.01}"
: "${BAND_HIGH_HZ:=0.1}"
: "${POLORT:=2}"
: "${CENSOR_MODE:=NTRP}"           # 3dTproject -cenmode: NTRP (interpolate) | KILL | ZERO
: "${MIN_DOF:=15}"                 # flag runs with fewer residual degrees of freedom
: "${MIN_RETAINED_MIN:=4}"         # flag runs with fewer retained minutes
: "${SMOOTH_FWHM:=6}"              # mm, volume output only; 0 = no smoothed copy

# ----------------------------- surface --------------------------------------
: "${SURFACE:=no}"                 # yes = fsLR-32k CIFTI branch (needs ANAT_MODE=freesurfer, MNI_RES=2)
: "${SURF_SMOOTH_FWHM:=5}"         # mm, wb_command -cifti-smoothing; 0 = off

# ----------------------------- time series ----------------------------------
: "${ATLASES:=Schaefer2018_100Parcels_7Networks Schaefer2018_200Parcels_7Networks}"
: "${CUSTOM_ATLASES:=}"            # space separated name=path pairs, volumes already in template space,
                                   # e.g. "Yeo100=/opt/fmriproc/parcellations/ThomasYeo_100.nii"
: "${MIN_ROI_COVERAGE:=0.5}"       # ROI becomes NaN below this fraction of valid voxels

# ----------------------------- QC flag thresholds ---------------------------
: "${QC_FD_MEAN_WARN:=0.2}";        : "${QC_FD_MEAN_FAIL:=0.5}"
: "${QC_PCT_CENSORED_WARN:=20}";    : "${QC_PCT_CENSORED_FAIL:=50}"
: "${QC_TSNR_GM_WARN:=40}";         : "${QC_TSNR_GM_FAIL:=20}"
: "${QC_COREG_DICE_WARN:=0.90}";    : "${QC_COREG_DICE_FAIL:=0.80}"
: "${QC_NORM_DICE_WARN:=0.93}";     : "${QC_NORM_DICE_FAIL:=0.88}"
: "${QC_EULER_HOLES_WARN:=100}";    : "${QC_EULER_HOLES_FAIL:=200}"
: "${QCFC_MIN_SUBJECTS:=10}"
